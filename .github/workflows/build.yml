name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
            | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK + AAB
        if: ${{ steps.keystore.outputs.present == 'true' }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Rename build artifacts
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' \
            app/build.gradle.kts | head -1)
          mv app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/android-camera_${VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk \
              "app/build/outputs/apk/release/android-camera_${VERSION}.apk"
            mv app/build/outputs/bundle/release/app-release.aab \
              "app/build/outputs/bundle/release/android-camera_${VERSION}.aab"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidcam-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK + AAB
        if: ${{ steps.keystore.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: androidcam-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p out
          if [ -d dist/androidcam-release ]; then
            cp dist/androidcam-release/*.apk dist/androidcam-release/*.aab out/
          else
            # No keystore configured: publish the debug build under the
            # plain package name.
            for f in dist/androidcam-debug/*.apk; do
              cp "$f" "out/$(basename "${f%-debug.apk}.apk")"
            done
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
